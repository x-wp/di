name: tests

on:
  workflow_call:
  pull_request:

jobs:
  phpunit:
    name: "PHP ${{ matrix.php }} / ${{ matrix.database }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        database: ['sqlite']
        include:
          - php: '8.3'
            database: mysql

    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_phpunit_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      WP_TESTS_DB_ENGINE: ${{ matrix.database }}
      WP_TESTS_DB_HOST: 127.0.0.1
      WP_TESTS_DB_NAME: wp_phpunit_tests
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: ${{ matrix.php == '8.3' && matrix.database == 'sqlite' && 'xdebug' || 'none' }}
          extensions: mysqli, pdo_mysql, pdo_sqlite, zip, apcu
          ini-values: apc.enable_cli=${{ matrix.php == '8.3' && matrix.database == 'sqlite' && '1' || '0' }}

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - run: composer install --no-progress --no-interaction --prefer-dist

      - run: php tests/bin/install-tests.php

      - if: matrix.php != '8.3' || matrix.database != 'sqlite'
        run: composer test

      - if: matrix.php == '8.3' && matrix.database == 'sqlite'
        run: composer test:coverage

      - if: matrix.php == '8.3' && matrix.database == 'sqlite'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            build/coverage
            build/logs

  static:
    name: Static analysis and coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-progress --no-interaction --prefer-dist
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/phpcs
